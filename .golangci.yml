version: "2"

linters:
  default: all
  disable:
    - inamedparam
    - gochecknoinits
    - wsl
    - wsl_v5
    - whitespace
    - wrapcheck
    - exhaustruct
    - exhaustruct_v5
    - err113
    - nlreturn
    - testpackage
    - depguard
    - paralleltest
    - varnamelen
    - forbidigo
    - funlen
    - gochecknoglobals
    - godox
    - lll
    - mnd
    - noinlineerr
    # funcorder demands constructor-then-exported-then-unexported ordering,
    # which conflicts with this codebase's existing, deliberate convention
    # of placing an unexported helper immediately after the exported method
    # that calls it (e.g. pubsubTopic.SubscribeWithBuffer / .subscribeWithBuffer
    # in topic.go) - readability here comes from proximity to the call site,
    # not from export-status grouping. Pure code-organization preference, no
    # correctness value; consistent with the other style linters already
    # disabled above.
    - funcorder
  settings:
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        # Generic functions must return their type parameter; that isn't
        # the "unnecessary interface" smell ireturn looks for.
        - generic
        # pubsub's own Topic and PubSub interfaces: every constructor
        # (NewTopic, NewPubSub, NewShardedPubSub, newTopicWithHistory,
        # newTopicWithLockFreeHistory, topicstore.SimpleStore/ShardedStore
        # .GetOrCreate) deliberately returns the interface to keep the
        # concrete implementation (pubsubTopic, topicWithHistory, pubSub)
        # an internal, swappable detail.
        - \.Topic$
        - \.PubSub$
        # otelpubsub.NewObserver deliberately returns the pubsub.Observer
        # interface it implements, keeping otelObserver private to the
        # otelpubsub package.
        - \.Observer$
  exclusions:
    rules:
      # Table-driven tests naturally accumulate cognitive/nesting
      # "complexity" from many small, independent per-case closures
      # (checkFunc, subtests); that's the idiomatic Go testing pattern
      # this project follows (see .claude/rules/go-testing.md), not a
      # sign the test itself is hard to follow. funlen is disabled
      # repo-wide for the same reason.
      - path: '_test\.go'
        linters:
          - cyclop
          - gocognit
          - gocyclo
          - maintidx
          - nestif
      # Repeated literals in tests are almost always fixture/expectation
      # data (a hostname, a header name, an error string) restated across
      # otherwise-independent table-driven cases, not a shared business
      # constant that drifted. Forcing every one into a package-level
      # const would couple unrelated test cases together for no benefit;
      # a magic number/string inside one test's own table is still
      # self-documenting in context. This is forward-looking policy, not
      # a description of today's findings: this repo's current goconst
      # hits ("Topic A"/"Topic B" in examples/merging, the "topic" metric
      # label in otelpubsub/observer.go) are all outside _test.go.
      - path: '_test\.go'
        linters:
          - goconst
      # PubSub (pubsub.go) is this package's top-level facade: its ~20
      # methods are the deliberate public surface covering publish/
      # subscribe variants, feeders, history and reliable delivery, lifted
      # from the existing Topic interface's narrower, single-purpose
      # methods. Splitting it would just push the same breadth onto every
      # caller as several interfaces instead of one.
      - path: 'pubsub\.go'
        linters:
          - interfacebloat

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
